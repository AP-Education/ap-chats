packages:
  - web
  - mobile

packageExtensions:
  # Keep Timeline's React types tied to the web package's React version.
  '@ap-education/timeline@0.1.4':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.5'
  - '@nestjs/config@12.0.1'
  - dotenv@18.0.3
  - '@nestjs/common@12.1.0'
  - '@nestjs/core@12.1.0'
  - '@nestjs/platform-fastify@12.1.0'
  - '@ap-education/*'

allowBuilds:
  esbuild: true
  msgpackr-extract: false

patchedDependencies:
  '@ap-education/timeline@0.1.4': patches/@ap-education__timeline@0.1.4.patch
  '@ap-education/ui@0.6.0': patches/@ap-education__ui@0.6.0.patch
  expo-callkit-telecom@0.5.0: patches/expo-callkit-telecom@0.5.0.patch
