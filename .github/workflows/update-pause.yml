# Stops new phones from taking an update; phones that have it keep it (docs/adr/0008-app-updates.md).
name: update-pause

on:
  workflow_dispatch:
    inputs:
      update:
        description: Update id
        type: string
        required: true

permissions:
  contents: read
  packages: read

# Urgent, so outside the updates queue: it neither waits behind a hung publish nor is
# cancelled by a run queued after it. The API keeps a revoked update revoked either way.

jobs:
  run:
    runs-on: ubuntu-latest
    # The admin token is an environment secret, and the environment only deploys from main,
    # so no other branch can run code that holds it.
    environment: updates
    timeout-minutes: 10
    env:
      UPDATES_API_URL: ${{ vars.UPDATES_API_URL }}
      UPDATE: ${{ inputs.update }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
      # Only the step that calls the API gets the admin token.
      - env:
          UPDATES_ADMIN_TOKEN: ${{ secrets.UPDATES_ADMIN_TOKEN }}
        run: node --import tsx scripts/updates/admin.ts pause --update "$UPDATE"
