name: API

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.json'
      - '*.yaml'
      - '*.mjs'
      - '.nvmrc'
      - '.prettier*'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'src/**'
      - '*.json'
      - '*.yaml'
      - '*.mjs'
      - '.nvmrc'
      - '.prettier*'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
          cache: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:api
      - run: pnpm build
      - run: pnpm exec prettier --check src package.json eslint.config.mjs
