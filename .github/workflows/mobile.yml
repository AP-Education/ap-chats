name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '*.json'
      - '*.yaml'
      - '*.mjs'
      - '.nvmrc'
      - '.npmrc'
      - '.prettier*'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '*.json'
      - '*.yaml'
      - '*.mjs'
      - '.nvmrc'
      - '.npmrc'
      - '.prettier*'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # pnpm reads registry credentials only from user-level config, never from the committed .npmrc.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
          cache: true
      - run: pnpm --filter @ap-chats/mobile lint
      - run: pnpm --filter @ap-chats/mobile typecheck
      - run: pnpm --filter @ap-chats/mobile test
      - run: pnpm exec prettier --check mobile
