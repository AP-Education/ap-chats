name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '*.json'
      - '*.yaml'
      - '*.mjs'
      - '.nvmrc'
      - '.prettier*'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '*.json'
      - '*.yaml'
      - '*.mjs'
      - '.nvmrc'
      - '.prettier*'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          require-lockfile: true
          cache: true
      - run: pnpm --filter @ap-connect/mobile lint
      - run: pnpm --filter @ap-connect/mobile typecheck
      - run: pnpm exec prettier --check mobile
