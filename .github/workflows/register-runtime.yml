# Records that a store build ships a runtime, so updates for it may be published (docs/adr/0008-app-updates.md).
name: register-runtime

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [ios, android]
      build:
        description: Store build number (iOS build number, Android version code)
        type: string
        required: true
      profile:
        description: EAS build profile it was made with
        type: choice
        options: [production, preview, apk]
        default: production
      runtime:
        description: Runtime version, when EAS cannot tell (empty = ask EAS)
        type: string
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: updates
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The admin token is an environment secret, and the environment only deploys from main,
    # so no other branch can run code that holds it.
    environment: updates
    timeout-minutes: 10
    env:
      UPDATES_API_URL: ${{ vars.UPDATES_API_URL }}
      PLATFORM: ${{ inputs.platform }}
      BUILD: ${{ inputs.build }}
      PROFILE: ${{ inputs.profile }}
      RUNTIME: ${{ inputs.runtime }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
      # Only the step that calls the API gets the admin token.
      - env:
          UPDATES_ADMIN_TOKEN: ${{ secrets.UPDATES_ADMIN_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node --import tsx scripts/updates/admin.ts register-runtime --platform "$PLATFORM" --build "$BUILD" --profile "$PROFILE" ${RUNTIME:+--runtime "$RUNTIME"}
