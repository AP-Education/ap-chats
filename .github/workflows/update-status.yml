# Shows the updates on a channel and how their launches go (docs/adr/0008-app-updates.md).
name: update-status

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read
  packages: read

# Read-only, so it never queues with, or cancels, a change.

jobs:
  run:
    runs-on: ubuntu-latest
    # The admin token is an environment secret, and the environment only deploys from main,
    # so no other branch can run code that holds it.
    environment: updates
    timeout-minutes: 10
    env:
      UPDATES_API_URL: ${{ vars.UPDATES_API_URL }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-auth-token: ${{ secrets.GITHUB_TOKEN }}
      # Only the step that calls the API gets the admin token.
      - env:
          UPDATES_ADMIN_TOKEN: ${{ secrets.UPDATES_ADMIN_TOKEN }}
        run: node --import tsx scripts/updates/admin.ts status --channel "$CHANNEL"
