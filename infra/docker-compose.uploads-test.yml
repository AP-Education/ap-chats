name: ap-chats-upload-tests

services:
  valkey:
    image: valkey/valkey:8.1.9-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6387:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: uploads-test
      POSTGRES_DB: uploads_test
    ports:
      - '127.0.0.1:5437:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d uploads_test']
      interval: 2s
      timeout: 2s
      retries: 30

  storage:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: uploads-test
      AWS_SECRET_ACCESS_KEY: uploads-test-secret
      S3_BUCKET: uploads-test
    ports:
      - '127.0.0.1:9017:8333'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9333/cluster/status']
      interval: 2s
      timeout: 2s
      retries: 30
