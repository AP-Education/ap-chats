---
# Requires docker_engine to have already run in this play — the rendered
# backup script shells out to `docker compose exec`. See compose_runtime's
# tasks/main.yml for why this is explicit playbook ordering, not a
# meta/main.yml dependency.
# Ubuntu dropped the standalone awscli apt package around 23.04/24.04 — no
# candidate in main/universe/multiverse on this image (confirmed against
# the actual droplet, not assumed). snap's aws-cli (publisher aws**,
# AWS's own official snap) is the replacement; it lands at /snap/bin/aws,
# which the backup script references by absolute path below since a
# systemd service's PATH doesn't reliably include /snap/bin.
- name: Ensure aws-cli snap is installed
  community.general.snap:
    name: aws-cli
    classic: true
  become: true

- name: Ensure bin directory exists
  ansible.builtin.file:
    path: '/opt/{{ project_name }}/bin'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'
  become: true

- name: Render backup script
  ansible.builtin.template:
    src: postgres-backup.sh.j2
    dest: '{{ postgres_backup_bin }}'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0700'
  become: true
  no_log: true

- name: Render backup systemd service
  ansible.builtin.template:
    src: postgres-backup.service.j2
    dest: /etc/systemd/system/postgres-backup.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reload systemd

- name: Render backup systemd timer
  ansible.builtin.template:
    src: postgres-backup.timer.j2
    dest: /etc/systemd/system/postgres-backup.timer
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reload systemd

- name: Flush systemd reload before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the backup timer
  ansible.builtin.systemd:
    name: postgres-backup.timer
    enabled: true
    state: started
  become: true
