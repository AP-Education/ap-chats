---
- name: Ensure awscli is installed
  ansible.builtin.apt:
    name: awscli
    state: present
    update_cache: true
  become: true

- name: Ensure bin directory exists
  ansible.builtin.file:
    path: '/opt/{{ project_name }}/bin'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'
  become: true

- name: Render backup script
  ansible.builtin.template:
    src: postgres-backup.sh.j2
    dest: '{{ postgres_backup_bin }}'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0700'
  become: true
  no_log: true

- name: Render backup systemd service
  ansible.builtin.template:
    src: postgres-backup.service.j2
    dest: /etc/systemd/system/postgres-backup.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reload systemd

- name: Render backup systemd timer
  ansible.builtin.template:
    src: postgres-backup.timer.j2
    dest: /etc/systemd/system/postgres-backup.timer
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: reload systemd

- name: Flush systemd reload before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the backup timer
  ansible.builtin.systemd:
    name: postgres-backup.timer
    enabled: true
    state: started
  become: true
