---
- name: Ensure Docker apt key is installed
  ansible.builtin.command: >
    bash -c "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg"
  args:
    creates: /etc/apt/keyrings/docker.gpg
  become: true

- name: Configure Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | regex_replace('^x86_64$','amd64') }}
      signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu
      {{ ansible_facts.lsb.codename }} stable
    filename: docker
    state: present
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    update_cache: true
    state: present
  become: true

- name: Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Add {{ ansible_user }} to the docker group
  ansible.builtin.user:
    name: '{{ ansible_user }}'
    groups: docker
    append: true
  become: true

- name: Ensure docker config directory exists
  ansible.builtin.file:
    path: '/home/{{ ansible_user }}/.docker'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0700'
  become: true
