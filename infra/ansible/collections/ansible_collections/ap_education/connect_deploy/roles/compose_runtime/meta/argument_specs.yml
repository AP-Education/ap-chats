argument_specs:
  main:
    short_description: Render and run the ap-connect docker-compose stack (Caddy edge, API, Postgres) from GHCR images.
    options:
      app_tag:
        type: str
        default: prod
        description: Image tag to deploy for both the api and web images.
      data_path:
        type: str
        default: '/mnt/<project_name>-data'
        description: Mounted data volume (see data_volume); Postgres, Valkey and Caddy state are bind-mounted from it.
      ghcr_username:
        type: str
        required: true
        description: GHCR username used to pull private images.
      ghcr_token:
        type: str
        required: true
        description: GHCR personal access token (read:packages).
      chats_domain:
        type: str
        required: true
        description: Public FQDN Caddy requests a TLS certificate for (e.g. chats.ap-platform.online).
      acme_email:
        type: str
        required: true
        description: Contact email for the Let's Encrypt account Caddy registers.
      postgres_password:
        type: str
        required: true
        no_log: true
        description: Password for the in-stack Postgres container.
      oidc_issuer:
        type: str
        required: true
        description: AP Accounts OIDC issuer URL this API verifies tokens against.
      oidc_audience:
        type: str
        required: true
        description: Resource audience this API's OIDC client expects.
      web_origin:
        type: str
        description: Value of WEB_ORIGIN / CORS origin. Defaults to https://<chats_domain>.
      log_transport:
        type: str
        default: json
        choices: [json, pretty]
      log_target_type:
        type: str
        default: stdout
        choices: [stdout, file, both]
      log_target_dest:
        type: str
        default: ''
        description: Required for file/both logging; the path must be writable by the container's node user.
      chat_upload_max_file_bytes:
        type: int
        default: 1000000000
      chat_upload_max_message_bytes:
        type: int
        default: 2000000000
      chat_upload_max_files:
        type: int
        default: 10
      chat_upload_max_pending_files:
        type: int
        default: 20
      chat_upload_max_pending_bytes:
        type: int
        default: 4000000000
      push_enabled:
        type: bool
        default: false
        description: Enable queued delivery only with an image containing feat/chat-push-notifications.
      valkey_url:
        type: str
        default: redis://valkey:6379/0
        no_log: true
      push_coalesce_seconds:
        type: int
        default: 3
      push_cooldown_seconds:
        type: int
        default: 30
      push_user_alerts_per_minute:
        type: int
        default: 5
      push_worker_enabled:
        type: bool
        default: true
      push_worker_concurrency:
        type: int
        default: 8
      expo_access_token:
        type: str
        default: ''
        no_log: true
      web_push_public_key:
        type: str
        default: ''
      web_push_private_key:
        type: str
        default: ''
        no_log: true
      web_push_subject:
        type: str
        default: ''
        description: 'VAPID contact, mailto: or https://. Set all three web_push fields or none.'
      do_spaces_endpoint:
        type: str
        required: true
      do_spaces_access_key:
        type: str
        required: true
        no_log: true
      do_spaces_secret_key:
        type: str
        required: true
        no_log: true
      do_spaces_bucket:
        type: str
        required: true
      livekit_url:
        type: str
        default: ''
        description: Public wss:// LiveKit endpoint reachable by browsers and mobile clients. Set all three LiveKit values or none.
      livekit_api_key:
        type: str
        default: ''
      livekit_api_secret:
        type: str
        default: ''
        no_log: true
      apns_key_id:
        type: str
        default: ''
      apns_team_id:
        type: str
        default: ''
      apns_private_key:
        type: str
        default: ''
        no_log: true
        description: Full Apple .p8 PEM with real newlines (YAML literal block), not a path or literal backslash-n escapes.
      apns_voip_topic:
        type: str
        default: ''
      fcm_project_id:
        type: str
        default: ''
      fcm_service_account_json:
        type: str
        default: ''
        no_log: true
        description: Full Firebase service account JSON as a string (YAML literal block), not a YAML mapping or file path.
