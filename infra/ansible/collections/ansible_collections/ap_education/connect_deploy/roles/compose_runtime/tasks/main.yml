---
# Requires docker_engine to have already run in this play (needs the
# docker CLI + compose plugin). Deliberately not a meta/main.yml
# `dependencies:` entry: tested that against this ansible-core version with
# two roles each depending on docker_engine in the same play, and it ran
# docker_engine twice instead of deduping — surprising, not "clear
# dependencies". Playbooks list docker_engine explicitly instead; keep it
# that way.
- name: Create project directory
  ansible.builtin.file:
    path: '{{ deploy_project_path }}'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'
  become: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ deploy_project_path }}/docker-compose.yml'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0644'
  become: true

- name: Render app.env
  ansible.builtin.template:
    src: app.env.j2
    dest: '{{ deploy_project_path }}/app.env'
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0600'
  become: true
  no_log: true

# become: false explicitly — the play sets become: true, and just omitting
# this line here still inherits that. docker_engine already creates
# ~/.docker owned by {{ ansible_user }}, and "Pull images" below runs as
# that same user (docker-group membership, not root) — becoming root here
# writes config.json as root and the later task can't read it.
- name: Log in to GHCR
  community.docker.docker_login:
    registry_url: '{{ ghcr_registry }}'
    username: '{{ ghcr_username }}'
    password: '{{ ghcr_token }}'
    config_path: '/home/{{ ansible_user }}/.docker/config.json'
    state: present
  become: false
  no_log: true

- name: Check whether the database is already running
  ansible.builtin.command:
    argv: [docker, compose, ps, --status, running, --quiet, postgres]
    chdir: '{{ deploy_project_path }}'
  register: compose_runtime_running_postgres
  changed_when: false
  failed_when: false
  become: true
  become_user: '{{ ansible_user }}'

- name: Check for the backup script
  ansible.builtin.stat:
    path: '{{ postgres_backup_bin }}'
  register: compose_runtime_backup_script
  become: true

# Bringing the stack up runs the release's migrations; this dump undoes a bad one without losing a day.
- name: Back up the database before migrating
  ansible.builtin.command: '{{ postgres_backup_bin }}'
  when:
    - compose_runtime_backup_script.stat.exists
    - compose_runtime_running_postgres.stdout | length > 0
  become: true
  become_user: '{{ ansible_user }}'

- name: Pull images and (re)create the stack
  community.docker.docker_compose_v2:
    project_src: '{{ deploy_project_path }}'
    pull: always
    state: present
    remove_orphans: true
  become: true
  become_user: '{{ ansible_user }}'

- name: List locally cached ap-connect image digests
  ansible.builtin.command:
    argv:
      - docker
      - images
      - '{{ item }}'
      - -q
      - --no-trunc
  loop:
    - '{{ app_image_repository }}'
    - '{{ web_image_repository }}'
  register: compose_runtime_cached_images
  become: true
  changed_when: false

# docker_image state=absent mirrors `docker rmi`: Docker itself refuses
# (409 Conflict, "must force") to remove an image still backing a
# container, so this only ever removes images nothing is using anymore —
# verified by actually running this against a live Docker daemon with a
# real in-use image before relying on it.
- name: Prune superseded ap-connect images
  community.docker.docker_image:
    name: '{{ item }}'
    state: absent
  loop: "{{ compose_runtime_cached_images.results | map(attribute='stdout_lines') | sum(start=[]) | unique }}"
  become: true
  failed_when: false
