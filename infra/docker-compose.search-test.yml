name: ap-chats-search-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: search-test
      POSTGRES_DB: search_test
    ports: ['127.0.0.1:5438:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d search_test']
      interval: 2s
      timeout: 2s
      retries: 30
  valkey:
    image: valkey/valkey:8.1.9-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:6388:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
