services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ap_chats
      POSTGRES_PASSWORD: ap_chats
      POSTGRES_DB: ap_chats
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - chats_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ap_chats -d ap_chats']
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev-mode SFU: single process, no TURN, keys match .env.example verbatim.
  # Swap for a real deployment via LIVEKIT_URL/API_KEY/API_SECRET; nothing else changes.
  livekit:
    image: livekit/livekit-server:latest
    command: ['--dev', '--keys', 'devkey: devsecret']
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '127.0.0.1:7882:7882/udp'

volumes:
  chats_postgres:
