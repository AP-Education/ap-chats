services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ap_connect
      POSTGRES_PASSWORD: ap_connect
      POSTGRES_DB: ap_connect
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - connect_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ap_connect -d ap_connect']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6381:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - connect_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  connect_postgres:
  connect_redis:
